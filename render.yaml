services:
  - type: web
    name: productivity-flow-engine
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: FLOW_DATABASE_URL
        sync: false
      - key: FLOW_EMAIL_SIGNIN
        value: 'false'
