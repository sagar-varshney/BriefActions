services:
  - type: web
    name: briefactions
    runtime: docker
    plan: free
    branch: main
    region: singapore
    autoDeployTrigger: checksPass
    healthCheckPath: /api/live
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: FLOW_DATABASE_URL
        sync: false
      - key: FLOW_EMAIL_SIGNIN
        value: 'false'
      - key: FLOW_MAX_WORKERS
        value: '1'
      - key: FLOW_TELEMETRY
        value: 'true'
