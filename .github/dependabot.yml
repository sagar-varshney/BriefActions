version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      javascript-patches:
        update-types: [patch]
  - package-ecosystem: pip
    directory: /
    # Preserved prototype dependencies do not ship in BriefActions.
    exclude-paths: [requirements-rag.txt]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
