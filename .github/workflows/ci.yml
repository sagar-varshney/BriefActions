name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: ./.github/workflows/security.yml

  quality:
    name: Python, API, build, browser, and benchmark checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: security
    # A skipped required check can be treated as passing. Run the gate even if
    # a security job fails, and explicitly fail before the application checks.
    if: ${{ always() }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: flow-ci-only
          POSTGRES_DB: flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      PYTHON_BIN: python
      PYTHONDONTWRITEBYTECODE: '1'
      LOKY_MAX_CPU_COUNT: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      FLOW_SCREENSHOTS: ${{ github.workspace }}/artifacts/screenshots
    steps:
      - name: Require successful security checks
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: test "$SECURITY_RESULT" = success

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-backup.txt
            requirements-hosted.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: |
          mkdir -p artifacts
          python -m pip install -r requirements-hosted.txt
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile

      - name: Run Python tests
        run: python -m unittest discover -s tests -v 2>&1 | tee artifacts/python-tests.log

      - name: Verify real Postgres workflows and account isolation
        env:
          FLOW_TEST_DATABASE_URL: postgresql://postgres:flow-ci-only@127.0.0.1:5432/flow
        run: python scripts/test_postgres.py 2>&1 | tee artifacts/postgres-tests.log

      - name: Verify encrypted backup and empty-database restore
        env:
          FLOW_TEST_DATABASE_URL: postgresql://postgres:flow-ci-only@127.0.0.1:5432/flow
        run: python scripts/test_backup_postgres.py 2>&1 | tee artifacts/backup-restore-tests.log

      - name: Check development extraction quality
        run: |
          python evaluate.py --extractor rules --split dev --output artifacts/rules-dev.json | tee artifacts/benchmark.log
          python scripts/check_benchmark.py artifacts/rules-dev.json | tee -a artifacts/benchmark.log

      - name: Check revision and cancellation development quality
        run: |
          python evaluate.py --extractor rules --dataset evaluation/revision-v1/dev.jsonl --split dev --output artifacts/revision-dev.json | tee artifacts/revision-benchmark.log
          python scripts/check_benchmark.py artifacts/revision-dev.json --dataset evaluation/revision-v1/dev.jsonl --baseline evaluation/results/revision-v1/rules-dev.json | tee -a artifacts/revision-benchmark.log

      - name: Check extraction audit development quality
        run: |
          python evaluate.py --extractor rules --dataset evaluation/audit-v1/dev.jsonl --split dev --output artifacts/audit-dev.json | tee artifacts/audit-benchmark.log
          python scripts/check_benchmark.py artifacts/audit-dev.json --dataset evaluation/audit-v1/dev.jsonl --baseline evaluation/audit-v1/results/after.json | tee -a artifacts/audit-benchmark.log

      - name: Run Node API tests
        env:
          FLOW_TEST_DATABASE_URL: postgresql://postgres:flow-ci-only@127.0.0.1:5432/flow
        run: pnpm test 2>&1 | tee artifacts/api-tests.log

      - name: Build React application
        run: pnpm build 2>&1 | tee artifacts/build.log

      - name: Record synthetic worker performance comparison
        run: node scripts/benchmark_workers.mjs artifacts/worker-performance.json

      - name: Install Chromium and Linux dependencies
        timeout-minutes: 5
        run: |
          # Avoid intermittent slow Azure mirror transfers on hosted Ubuntu runners.
          # Keep signed Ubuntu packages and the existing fallback mirrors.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\tpriority:%s\n' \
              'https://archive.ubuntu.com/ubuntu/' 1 \
              'https://security.ubuntu.com/ubuntu/' 2 \
              'http://azure.archive.ubuntu.com/ubuntu/' 3 \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' \
            'Acquire::Retries "2";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80briefactions-ci-network >/dev/null
          pnpm exec playwright install --with-deps chromium

      - name: Run desktop and mobile browser checks
        run: pnpm test:browser 2>&1 | tee artifacts/browser-tests.log

      - name: Verify production container and persistent storage readiness
        run: |
          docker build -t flow-ci .
          docker run --detach --name flow-ci --network host -e PORT=8020 -e PUBLIC_ORIGIN=https://flow.example -e SUPABASE_URL=https://test-project.supabase.co -e SUPABASE_PUBLISHABLE_KEY=sb_publishable_test -e SUPABASE_SECRET_KEY=sb_secret_ci_fixture -e FLOW_DATABASE_URL=postgresql://postgres:flow-ci-only@127.0.0.1:5432/flow flow-ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8020/api/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8020/api/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8020/api/runs)" = 401
          docker logs flow-ci > artifacts/container.log 2>&1
          docker stop flow-ci

      - name: Verify the free-hosting CPU and memory profile
        env:
          FLOW_TEST_DATABASE_URL: postgresql://postgres:flow-ci-only@127.0.0.1:5432/flow
        run: pnpm test:hosting --image flow-ci --output artifacts/hosting-load.json 2>&1 | tee artifacts/hosting-load.log

      - name: Retain verification reports and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-verification-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
