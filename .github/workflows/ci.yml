name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python, API, build, browser, and benchmark checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      PYTHON_BIN: python
      PYTHONDONTWRITEBYTECODE: '1'
      LOKY_MAX_CPU_COUNT: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      FLOW_SCREENSHOTS: ${{ github.workspace }}/artifacts/screenshots
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: |
          mkdir -p artifacts
          python -m pip install -r requirements.txt
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile

      - name: Run Python tests
        run: python -m unittest discover -s tests -v 2>&1 | tee artifacts/python-tests.log

      - name: Check development extraction quality
        run: |
          python evaluate.py --extractor rules --split dev --output artifacts/rules-dev.json | tee artifacts/benchmark.log
          python scripts/check_benchmark.py artifacts/rules-dev.json | tee -a artifacts/benchmark.log

      - name: Run Node API tests
        run: pnpm test 2>&1 | tee artifacts/api-tests.log

      - name: Build React application
        run: pnpm build 2>&1 | tee artifacts/build.log

      - name: Install Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run desktop and mobile browser checks
        run: pnpm test:browser 2>&1 | tee artifacts/browser-tests.log

      - name: Retain verification reports and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-verification-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
