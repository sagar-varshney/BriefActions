name: Security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Scan Git history for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all fetched history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --ignore-gitleaks-allow --config=.gitleaks.toml --log-opts=--all'
      - name: Verify deleted-secret detection and redaction
        run: python3 scripts/test_secret_scanner.py "$RUNNER_TEMP/gitleaks"

  dependencies:
    name: Audit hosted dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install audit tools
        run: |
          npm install --global pnpm@11.25.0
          python -m pip install pip-audit==2.9.0
      - name: Audit Node lockfile (including build dependencies)
        run: pnpm audit
      - name: Audit resolved hosted Python requirements
        run: python -m pip_audit -r requirements-hosted.txt --timeout 30
